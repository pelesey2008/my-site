<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
scroll-behavior:smooth;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

/* МЕНЮ */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:center;
gap:20px;
padding:15px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

/* ОСНОВА */
.container{
max-width:900px;
margin:auto;
padding:100px 20px 40px;
}

/* ГЛАВНЫЙ БЛОК */
.hero{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:30px;
margin-bottom:30px;
}

.avatar{
width:200px;
height:200px;
border-radius:20px;
object-fit:cover;
}

/* ТЕКСТ */
.info{
flex:1;
min-width:250px;
}

.info h1{
margin-bottom:10px;
}

/* СЕКЦИИ */
.section{
margin-top:25px;
padding:20px;
background:rgba(255,255,255,0.08);
border-radius:15px;
}

/* НАВЫКИ */
.skills span{
display:inline-block;
margin:5px;
padding:6px 10px;
background:rgba(255,255,255,0.15);
border-radius:8px;
}

/* КНОПКИ */
button{
margin-top:10px;
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
background:#ff6a00;
color:white;
}

/* СОЦСЕТИ */
.social a{
display:inline-block;
margin:5px;
padding:8px 12px;
background:white;
color:black;
border-radius:8px;
text-decoration:none;
}

/* АДАПТИВ */
@media(max-width:600px){
.hero{
flex-direction:column;
text-align:center;
}
}
</style>
</head>

<body>

<!-- МЕНЮ -->
<nav>
<a href="#about">Обо мне</a>
<a href="#skills">Навыки</a>
<a href="#projects">Проекты</a>
<a href="#contact">Контакты</a>
</nav>

<div class="container">

<!-- ГЛАВНЫЙ БЛОК -->
<div class="hero">
<img src="photo.jpg" class="avatar">

<div class="info">
<h1>Елисей Персань</h1>
<p>24ИСИП | БИК | Белгород</p>
<p>Начинающий frontend-разработчик</p>

<button onclick="alert('Спасибо за регистрацию!')">Регистрация</button>
</div>
</div>

<!-- ОБО МНЕ -->
<div id="about" class="section">
<h2>Обо мне</h2>
<p>Я студент и изучаю веб-разработку. Осваиваю HTML, CSS и JavaScript.</p>
</div>

<!-- НАВЫКИ -->
<div id="skills" class="section skills">
<h2>Навыки</h2>
<span>HTML</span>
<span>CSS</span>
<span>JavaScript</span>
<span>GitHub</span>
</div>

<!-- ПРОЕКТЫ -->
<div id="projects" class="section">
<h2>Проекты</h2>
<p>✔ Сайт-визитка</p>
<p>✔ Учебные проекты</p>
</div>

<!-- КОНТАКТЫ -->
<div id="contact" class="section social">
<h2>Контакты</h2>
<a href="https://t.me/Ssygckh">Telegram</a>
<a href="https://vk.com/id647354987">VK</a>
</div>

</div>

</body>
</html>
