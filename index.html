<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио | Елисей</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
max-width:900px;
width:100%;
}

header{
text-align:center;
margin-bottom:20px;
}

header h1{
font-size:28px;
}

.card{
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
text-align:center;
}

.avatar{
width:140px;
height:140px;
border-radius:50%;
margin:15px auto;
border:3px solid white;
object-fit:cover;
}

section{
margin-top:20px;
}

.skills span{
display:inline-block;
margin:5px;
padding:6px 10px;
background:rgba(255,255,255,0.2);
border-radius:8px;
font-size:13px;
}

button{
margin-top:15px;
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

button:hover{
background:black;
color:white;
}

.social a{
display:inline-block;
margin:5px;
padding:8px 12px;
background:white;
color:black;
border-radius:8px;
text-decoration:none;
transition:0.3s;
}

.social a:hover{
transform:scale(1.05);
}

/* МОДАЛКА */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.modal-box{
background:white;
color:black;
padding:20px;
border-radius:15px;
width:90%;
max-width:300px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #ccc;
}

/* ТОСТ УВЕДОМЛЕНИЕ */
.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#1f2937;
color:white;
padding:12px 20px;
border-radius:10px;
opacity:0;
pointer-events:none;
transition:0.5s;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(-10px);
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>👨‍💻 Портфолио разработчика</h1>
</header>

<div class="card">

<h2>Елисей Персань</h2>
<p>24ИСИП | БИК | Белгород</p>

<img src="https://via.placeholder.com/140" class="avatar">

<section>
<h2>Обо мне</h2>
<p>Я студент и изучаю веб-разработку (HTML, CSS, JS).</p>
</section>

<section>
<h2>Навыки</h2>
<div class="skills">
<span>HTML</span>
<span>CSS</span>
<span>JavaScript</span>
</div>
</section>

<button onclick="openModal()">Регистрация</button>

<section class="social">
<h2>Контакты</h2>
<a href="https://t.me/Ssygckh" target="_blank">Telegram</a>
<a href="https://vk.com/id647354987" target="_blank">VK</a>
</section>

</div>
</div>

<!-- МОДАЛКА -->
<div id="modal" class="modal">
<div class="modal-box">

<h2>Регистрация</h2>

<input type="text" placeholder="Имя">
<input type="email" placeholder="Email">

<button onclick="register()">Отправить</button>
<button onclick="closeModal()">Закрыть</button>

</div>
</div>

<!-- ТОСТ -->
<div id="toast" class="toast">Спасибо за регистрацию! 🎉</div>

<script>
function openModal(){
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function register(){
closeModal();

let toast = document.getElementById("toast");
toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},3000);
}
</script>

</body>
</html>
