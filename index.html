<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
scroll-behavior:smooth;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

/* МЕНЮ */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:center;
gap:20px;
padding:15px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

/* ОСНОВА */
.container{
max-width:900px;
margin:auto;
padding:100px 20px 40px;
}

/* HERO */
.hero{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:30px;
margin-bottom:30px;
}

.avatar{
width:200px;
height:200px;
border-radius:20px;
object-fit:cover;
}

.info{
flex:1;
min-width:250px;
}

.section{
margin-top:25px;
padding:20px;
background:rgba(255,255,255,0.08);
border-radius:15px;
}

.skills span{
display:inline-block;
margin:5px;
padding:6px 10px;
background:rgba(255,255,255,0.15);
border-radius:8px;
}

/* КНОПКИ */
button{
margin-top:10px;
padding:12px 18px;
border:none;
border-radius:12px;
cursor:pointer;
background:linear-gradient(135deg,#ff6a00,#ee0979);
color:white;
font-weight:bold;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

/* СОЦСЕТИ */
.social a{
display:inline-block;
margin:5px;
padding:10px 14px;
background:white;
color:black;
border-radius:10px;
text-decoration:none;
}

/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:0.3s;
}

.popup.active{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:linear-gradient(135deg,#00c6ff,#0072ff);
padding:30px;
border-radius:20px;
text-align:center;
color:white;
width:90%;
max-width:320px;
animation:pop 0.4s ease;
box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

.popup-box h2{
margin-bottom:10px;
}

.popup-box button{
background:white;
color:black;
margin-top:15px;
}

@keyframes pop{
from{
transform:scale(0.7);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

/* АДАПТИВ */
@media(max-width:600px){
.hero{
flex-direction:column;
text-align:center;
}
}
</style>
</head>

<body>

<nav>
<a href="#about">Обо мне</a>
<a href="#skills">Навыки</a>
<a href="#projects">Проекты</a>
<a href="#contact">Контакты</a>
</nav>

<div class="container">

<div class="hero">
<img src="photo.jpg" class="avatar">

<div class="info">
<h1>Елисей Персань</h1>
<p>24ИСИП | БИК | Белгород</p>
<p>Начинающий frontend-разработчик</p>

<button onclick="openPopup()">Регистрация</button>
</div>
</div>

<div id="about" class="section">
<h2>Обо мне</h2>
<p>Я студент и изучаю веб-разработку.</p>
</div>

<div id="skills" class="section skills">
<h2>Навыки</h2>
<span>HTML</span>
<span>CSS</span>
<span>JavaScript</span>
<span>GitHub</span>
</div>

<div id="projects" class="section">
<h2>Проекты</h2>
<p>✔ Сайт-визитка</p>
<p>✔ Учебные проекты</p>
</div>

<div id="contact" class="section social">
<h2>Контакты</h2>
<a href="https://t.me/Ssygckh">Telegram</a>
<a href="https://vk.com/id647354987">VK</a>
</div>

</div>

<!-- POPUP -->
<div id="popup" class="popup">
<div class="popup-box">
<h2>🎉 Успешно!</h2>
<p>Спасибо за регистрацию!</p>
<button onclick="closePopup()">Закрыть</button>
</div>
</div>

<script>
function openPopup(){
let p=document.getElementById("popup");
p.classList.add("active");

setTimeout(()=>{
p.classList.remove("active");
},2500);
}

function closePopup(){
document.getElementById("popup").classList.remove("active");
}
</script>

</body>
</html>
