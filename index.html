<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио | Елисей</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
min-height:100vh;
animation:fade 1s ease-in;
}

@keyframes fade{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

/* ШАПКА */
header{
text-align:center;
margin-bottom:30px;
}

header h1{
font-size:28px;
}

/* КАРТОЧКА */
.card{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
text-align:center;
}

.avatar{
width:140px;
height:140px;
margin:15px auto;
border-radius:50%;
background:linear-gradient(135deg,#00c6ff,#0072ff);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

/* СЕКЦИИ */
section{
margin-top:20px;
}

section h2{
margin-bottom:10px;
}

/* НАВЫКИ */
.skills span{
display:inline-block;
margin:5px;
padding:6px 10px;
background:rgba(255,255,255,0.2);
border-radius:8px;
font-size:13px;
}

/* КНОПКИ */
button{
margin-top:15px;
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

button:hover{
background:black;
color:white;
}

/* СОЦ СЕТИ */
.social a{
display:inline-block;
margin:5px;
padding:8px 12px;
background:white;
color:black;
border-radius:8px;
text-decoration:none;
transition:0.3s;
}

.social a:hover{
transform:scale(1.05);
}

/* МОДАЛКА */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.modal-box{
background:white;
color:black;
padding:20px;
border-radius:15px;
width:90%;
max-width:300px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>👨‍💻 Портфолио разработчика</h1>
</header>

<div class="card">

<h2>Елисей Персань</h2>
<p>24ИСИП | БИК | Белгород</p>

<div class="avatar">PHOTO</div>

<section>
<h2>Обо мне</h2>
<p>Я студент и изучаю веб-разработку. Работаю с HTML, CSS и JavaScript.</p>
</section>

<section>
<h2>Навыки</h2>
<div class="skills">
<span>HTML</span>
<span>CSS</span>
<span>JavaScript</span>
</div>
</section>

<button onclick="openModal()">Регистрация</button>

<section class="social">
<h2>Контакты</h2>
<a href="https://t.me/">Telegram</a>
<a href="https://vk.com/">VK</a>
</section>

</div>

</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modal" class="modal">
<div class="modal-box">

<h2>Регистрация</h2>

<input type="text" placeholder="Имя">
<input type="email" placeholder="Email">

<button onclick="register()">Отправить</button>
<button onclick="closeModal()">Закрыть</button>

</div>
</div>

<script>
function openModal(){
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function register(){
alert("Спасибо за регистрацию!");
closeModal();
}
</script>

</body>
</html>
