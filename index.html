<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио студента</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
display:flex;
justify-content:center;
padding:20px;
min-height:100vh;
}

.card{
width:100%;
max-width:700px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.5);
animation:fade 0.8s ease;
}

@keyframes fade{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.avatar{
width:140px;
height:140px;
border-radius:50%;
margin:15px auto;
border:3px solid white;
object-fit:cover;
}

h1{
margin-top:10px;
}

section{
margin-top:20px;
text-align:left;
}

h2{
margin-bottom:8px;
color:#00c6ff;
}

.skills span{
display:inline-block;
margin:5px;
padding:6px 10px;
background:rgba(255,255,255,0.15);
border-radius:8px;
font-size:13px;
}

.projects p{
margin:6px 0;
}

button{
padding:12px 18px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(135deg,#ff6a00,#ee0979);
color:white;
margin-top:15px;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.social a{
display:inline-block;
margin:6px;
padding:10px 14px;
background:white;
color:black;
border-radius:10px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.social a:hover{
background:#00c6ff;
color:white;
}
</style>
</head>

<body>

<div class="card">

<h1>Елисей Персань</h1>
<p>24ИСИП | БИК | Белгород</p>

<img src="img/photo.jpg" class="avatar">

<!-- ОБО МНЕ -->
<section>
<h2>Обо мне</h2>
<p>Я студент и изучаю веб-разработку. Осваиваю HTML, CSS и JavaScript. Цель — стать frontend-разработчиком.</p>
</section>

<!-- НАВЫКИ -->
<section>
<h2>Навыки</h2>
<div class="skills">
<span>HTML</span>
<span>CSS</span>
<span>JavaScript (нач.)</span>
<span>GitHub</span>
</div>
</section>

<!-- ПРОЕКТЫ -->
<section class="projects">
<h2>Проекты</h2>
<p>✔ Сайт-визитка (этот проект)</p>
<p>✔ Учебные работы по HTML/CSS</p>
</section>

<!-- КНОПКА -->
<button onclick="register()">Регистрация</button>

<!-- КОНТАКТЫ -->
<section class="social">
<h2>Контакты</h2>
<a href="https://t.me/Ssygckh" target="_blank">Telegram</a>
<a href="https://vk.com/id647354987" target="_blank">VK</a>
</section>

</div>

<script>
function register(){
alert("🎉 Спасибо за регистрацию!");
}
</script>

</body>
</html>
