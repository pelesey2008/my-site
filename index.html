<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио студента</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
padding:20px;
}

/* КАРТОЧКА */
.card{
width:100%;
max-width:800px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.5);
animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

/* АВАТАР */
.avatar{
width:140px;
height:140px;
border-radius:50%;
margin:15px auto;
object-fit:cover;
border:3px solid rgba(255,255,255,0.7);
box-shadow:0 10px 25px rgba(0,0,0,0.4);
transition:0.3s;
}

.avatar:hover{
transform:scale(1.05);
}

/* КНОПКИ */
button{
margin-top:15px;
padding:12px 18px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:bold;
color:white;
background:linear-gradient(135deg,#ff6a00,#ee0979);
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}

/* СОЦСЕТИ */
.social a{
display:inline-block;
margin:8px;
padding:12px 16px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
color:white;
background:linear-gradient(135deg,#141e30,#243b55);
box-shadow:0 8px 20px rgba(0,0,0,0.3);
transition:0.3s;
}

.social a:hover{
transform:translateY(-4px) scale(1.05);
background:linear-gradient(135deg,#00c6ff,#0072ff);
}

/* МОДАЛКА */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.modal-box{
background:white;
color:black;
padding:20px;
border-radius:15px;
width:90%;
max-width:320px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #ccc;
}

/* УВЕДОМЛЕНИЕ */
.toast{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0.8);
background:linear-gradient(135deg,#00c6ff,#0072ff);
color:white;
padding:20px 30px;
border-radius:16px;
font-size:18px;
font-weight:bold;
box-shadow:0 20px 50px rgba(0,0,0,0.5);
opacity:0;
transition:0.4s;
text-align:center;
min-width:260px;
}

.toast.show{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}
</style>

</head>

<body>

<div class="card">

<h1>Елисей Персань</h1>
<p>24ИСИП | БИК | Белгород</p>

<!-- АВАТАР -->
<img src="Screenshot_20260505_223912.jpg" class="avatar">

<p>Я студент, изучаю веб-разработку (HTML, CSS, JS)</p>

<!-- КНОПКА -->
<button onclick="openModal()">Регистрация</button>

<!-- СОЦСЕТИ -->
<div class="social">
<h3>Контакты</h3>
<a href="https://t.me/Ssygckh" target="_blank">Telegram</a>
<a href="https://vk.com/id647354987" target="_blank">VK</a>
</div>

</div>

<!-- МОДАЛКА -->
<div id="modal" class="modal">
<div class="modal-box">

<h3>Регистрация</h3>

<input type="text" placeholder="Имя">
<input type="email" placeholder="Email">

<button onclick="register()">Отправить</button>
<button onclick="closeModal()">Закрыть</button>

</div>
</div>

<!-- УВЕДОМЛЕНИЕ -->
<div id="toast" class="toast">🎉 Регистрация успешно завершена</div>

<script>
function openModal(){
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function register(){
closeModal();

let toast=document.getElementById("toast");
toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},3000);
}
</script>

</body>
</html>
