<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио студента</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
scroll-behavior:smooth;
}

/* ТЕМА */
body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
transition:0.3s;
}

/* МЕНЮ */
nav{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
z-index:1000;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:bold;
cursor:pointer;
}

/* КАРТОЧКА */
.container{
padding-top:80px;
display:flex;
justify-content:center;
}

.card{
width:100%;
max-width:700px;
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:20px;
text-align:center;
backdrop-filter:blur(10px);
box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

/* СЕКЦИИ */
section{
margin-top:30px;
text-align:left;
padding:10px;
border-radius:12px;
transition:0.4s;
}

section.active{
background:rgba(0,198,255,0.15);
box-shadow:0 0 15px rgba(0,198,255,0.4);
transform:scale(1.02);
}

h2{
color:#00c6ff;
margin-bottom:10px;
}

/* АВАТАР */
.avatar{
width:140px;
height:140px;
border-radius:50%;
margin:15px auto;
border:3px solid white;
object-fit:cover;
display:block;
}

/* НАВЫКИ */
.skills span{
display:inline-block;
margin:5px;
padding:6px 10px;
background:rgba(255,255,255,0.15);
border-radius:8px;
}

/* КНОПКА */
button{
padding:12px 18px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(135deg,#ff6a00,#ee0979);
color:white;
margin-top:15px;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

/* СОЦСЕТИ */
.social a{
display:inline-block;
margin:6px;
padding:10px 14px;
background:white;
color:black;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

/* POPUP */
.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0.8);
background:linear-gradient(135deg,#00c6ff,#0072ff);
padding:20px 30px;
border-radius:15px;
color:white;
font-weight:bold;
opacity:0;
transition:0.3s;
text-align:center;
}

.popup.show{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}
</style>
</head>

<body>

<!-- МЕНЮ -->
<nav>
<div>
<a href="#about" onclick="highlight('about')">Обо мне</a>
<a href="#skills" onclick="highlight('skills')">Навыки</a>
<a href="#projects" onclick="highlight('projects')">Проекты</a>
<a href="#contact" onclick="highlight('contact')">Контакты</a>
</div>
</nav>

<div class="container">

<div class="card">

<h1>Елисей Персань</h1>
<p>24ИСИП | БИК | Белгород</p>

<!-- ФОТО -->
<img src="photo.jpg" class="avatar">

<!-- ОБО МНЕ -->
<section id="about">
<h2>Обо мне</h2>
<p>Я студент и изучаю веб-разработку. Хочу стать frontend-разработчиком.</p>
</section>

<!-- НАВЫКИ -->
<section id="skills">
<h2>Навыки</h2>
<div class="skills">
<span>HTML</span>
<span>CSS</span>
<span>JavaScript</span>
<span>GitHub</span>
</div>
</section>

<!-- ПРОЕКТЫ -->
<section id="projects">
<h2>Проекты</h2>
<p>✔ Сайт-визитка</p>
<p>✔ Учебные работы</p>
</section>

<button onclick="register()">Регистрация</button>

<!-- КОНТАКТЫ -->
<section id="contact" class="social">
<h2>Контакты</h2>
<a href="https://t.me/Ssygckh" target="_blank">Telegram</a>
<a href="https://vk.com/id647354987" target="_blank">VK</a>
</section>

</div>
</div>

<!-- POPUP -->
<div id="popup" class="popup">🎉 Спасибо за регистрацию!</div>

<script>
function register(){
let p=document.getElementById("popup");
p.classList.add("show");

setTimeout(()=>{
p.classList.remove("show");
},2500);
}

function highlight(id){
let el=document.getElementById(id);

el.classList.add("active");

setTimeout(()=>{
el.classList.remove("active");
},1200);
}
</script>

</body>
</html>
