<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Визитка студента</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
display:flex;
flex-wrap:wrap;
gap:25px;
padding:25px;
background:rgba(255,255,255,0.08);
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
max-width:900px;
width:100%;
justify-content:space-between;
}

.left{
flex:1;
min-width:250px;
}

.avatar{
width:180px;
height:180px;
border-radius:20px;
background:linear-gradient(135deg,#00c6ff,#0072ff);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

h1{
margin:0;
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
transition:0.3s;
}

button:hover{
background:black;
color:white;
}

.social a{
display:inline-block;
margin:5px;
padding:8px 12px;
background:white;
color:black;
text-decoration:none;
border-radius:8px;
transition:0.3s;
}

.social a:hover{
transform:scale(1.05);
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.modal-box{
background:white;
color:black;
padding:20px;
border-radius:15px;
width:90%;
max-width:300px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="card">

<div class="left">
<h1>Елисей Персань</h1>
<p>24ИСИП | БИК | Белгород</p>
<p>Студент веб-разработчик (HTML / CSS)</p>

<button onclick="openModal()">Регистрация</button>

<div class="social">
<a href="https://t.me/">Telegram</a>
<a href="https://vk.com">VK</a>
</div>
</div>

<div class="avatar">
PROFILE
</div>

</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modal" class="modal">
<div class="modal-box">

<h2>Регистрация</h2>

<input type="text" placeholder="Имя">
<input type="email" placeholder="Email">

<button onclick="register()">Отправить</button>
<button onclick="closeModal()">Закрыть</button>

</div>
</div>

<script>
function openModal(){
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function register(){
alert("Спасибо за регистрацию!");
closeModal();
}
</script>

</body>
</html>
